[package]
name = "qqq_monitor"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lengyc-Code/qqq_monitor"

[workspace]
members = ["crates/qqq-domain", "crates/qqq-engine", "crates/qqq-platform-windows", "crates/qqq-remote", "crates/qqq-ui"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lengyc-Code/qqq_monitor"

[workspace.dependencies]
qqq-domain = { path = "crates/qqq-domain" }
qqq-engine = { path = "crates/qqq-engine" }
qqq-platform-windows = { path = "crates/qqq-platform-windows" }
qqq-remote = { path = "crates/qqq-remote" }
qqq-ui = { path = "crates/qqq-ui" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui_plot = "0.37.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Etw", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
embed-resource = "3"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.53", features = ["rt", "net", "time", "macros", "sync"] }

[dependencies]
qqq-domain.workspace = true
qqq-engine.workspace = true
qqq-platform-windows.workspace = true
qqq-remote.workspace = true
qqq-ui.workspace = true
eframe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[build-dependencies]
embed-resource.workspace = true
