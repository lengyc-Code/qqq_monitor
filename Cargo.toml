[package]
name = "qqq_monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace]
members = ["crates/qqq-domain", "crates/qqq-engine", "crates/qqq-platform-windows", "crates/qqq-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
qqq-domain = { path = "crates/qqq-domain" }
qqq-engine = { path = "crates/qqq-engine" }
qqq-platform-windows = { path = "crates/qqq-platform-windows" }
qqq-ui = { path = "crates/qqq-ui" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui_plot = "0.37.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dependencies]
qqq-domain.workspace = true
qqq-engine.workspace = true
qqq-platform-windows.workspace = true
qqq-ui.workspace = true
eframe.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
